<!DOCTYPE html><html lang="ko"><head><meta charset="utf-8">

<style>
 :root{color-scheme:dark} *{box-sizing:border-box}
 body{margin:0;padding:18px;background:#0f1115;color:#e8ecf1;font-family:-apple-system,BlinkMacSystemFont,'Malgun Gothic',sans-serif}
 h1{font-size:19px;margin:0 0 4px} .sub{color:#8b96a5;font-size:13px;margin-bottom:16px}
 .card{background:#171a21;border:1px solid #262b36;border-radius:14px;padding:14px;margin-bottom:14px}
 h2{font-size:15px;margin:0 0 10px;color:#6ea8fe}
 textarea{width:100%;background:#0f1115;color:#e8ecf1;border:1px solid #2b3140;border-radius:10px;padding:11px;font-size:14px;line-height:1.5;resize:vertical;font-family:inherit}
 .btns{margin-top:10px;display:flex;gap:8px;flex-wrap:wrap}
 button{background:#3182f6;color:#fff;border:0;border-radius:10px;padding:11px 15px;font-size:14px;font-weight:600;cursor:pointer}
 button.sec{background:#2b3140} button:active{transform:scale(.98)}
 .msg{font-size:13px;margin-top:8px;color:#4ade80;min-height:16px}
 .imgbox{margin-top:12px} .imgbox img{width:100%;max-width:520px;border-radius:10px;display:block}
 footer{color:#6b7684;font-size:12px;margin-top:18px}
</style></head><body>
<h1>공유 문구 복사 (티스토리 가이드)</h1>
<div class="sub">Chrome/사파리에서 열어 버튼으로 복사하세요. 카드 이미지는 길게 눌러 저장.</div>

  <section class="card">

⚠️ 상한을 모르고 계약하면 연 100만 원을 그냥 냅니다.

#전월세전환율 #전세 #월세 #임대차 #부동산</textarea>
    <div class="btns">
      <button onclick="copyBlock(0)">📋 문구 복사</button>
      <button class="sec" onclick="copyShort(0)">🔗 링크만 복사</button>

    <div class="msg" id="m0"></div>
    <div class="imgbox"><img src="DAY51-전월세-전환율.jpg" alt="전월세 전환율 카드"></div>

  <section class="card">
    <h2>주택임대소득</h2>
    <textarea id="t1" readonly rows="10">💰 월세 받는데 세금 얼마나 나올까?

#주택임대소득 #분리과세 #임대소득세 #절세 #월세</textarea>
    <div class="btns">
      <button onclick="copyBlock(1)">📋 문구 복사</button>
      <button class="sec" onclick="copyShort(1)">🔗 링크만 복사</button>
    </div>
    <div class="msg" id="m1"></div>
    <div class="imgbox"><img src="DAY49-주택임대소득-과세.jpg" alt="주택임대소득 카드"></div>
  </section>
  <section class="card">
    <h2>공시가격</h2>
    <textarea id="t2" readonly rows="10">📢 공시가격 한 줄이 세금 전체를 바꿉니다

4~5월에 꼭 확인하세요.

#공시가격 #재산세 #종부세 #건강보험료 #부동산</textarea>
    <div class="btns">
      <button onclick="copyBlock(2)">📋 문구 복사</button>
      <button class="sec" onclick="copyShort(2)">🔗 링크만 복사</button>
    </div>
    <div class="msg" id="m2"></div>
    <div class="imgbox"><img src="DAY53-공시가격-세금.jpg" alt="공시가격 카드"></div>
  </section>
<footer>하루 1~2개씩 카카오스토리·밴드·디시에 나눠 올리면 초기 클릭 신호가 됩니다.</footer>
<script>
const LINKS = ["https://wildmach.tistory.com/1225", "https://wildmach.tistory.com/1223", "https://wildmach.tistory.com/1227"];
const TEXTS = ["🏠 전세를 월세로 바꿀 때, 얼마가 적당할까?\n\n1️⃣ 법정 상한 = 한국은행 기준금리 + 2%p (최대 10%)\n2️⃣ 월세 = (전환 보증금 × 전환율) ÷ 12\n3️⃣ 전환금액 1억이면 전환율 1%p 차이로 월 8만 원 차이!\n\n⚠️ 상한을 모르고 계약하면 연 100만 원을 그냥 냅니다.\n👉 https://wildmach.tistory.com/1225\n#전월세전환율 #전세 #월세 #임대차 #부동산", "💰 월세 받는데 세금 얼마나 나올까?\n\n1️⃣ 연 2,000만 원 이하면 분리과세(14%) 선택 가능 — 대부분 유리\n2️⃣ 필요경비: 등록임대 60% / 미등록 50%\n3️⃣ 사업자등록 안 하면 수입금액의 0.2% 가산세\n\n월세 연 1,200만 원 → 세액 약 61만 원 수준입니다.\n👉 https://wildmach.tistory.com/1223\n#주택임대소득 #분리과세 #임대소득세 #절세 #월세", "📢 공시가격 한 줄이 세금 전체를 바꿉니다\n\n1️⃣ 매년 1월 1일 기준 → 4월 30일 공시\n2️⃣ 재산세·종부세·취득세·건강보험료까지 연쇄 영향\n3️⃣ 부당하면 공시 후 30일 내 이의신청 (실거래가 증빙이 가장 강력)\n\n4~5월에 꼭 확인하세요.\n👉 https://wildmach.tistory.com/1227\n#공시가격 #재산세 #종부세 #건강보험료 #부동산"];
function flash(i, ok) {
  const m = document.getElementById('m' + i);
  m.textContent = ok ? '✅ 복사됨!' : '⚠️ 자동 복사 차단 → 텍스트 선택 후 Ctrl+C';
  setTimeout(() => m.textContent = '', 2400);
}
function fallback(text, i) {
  const ta = document.createElement('textarea'); ta.value = text;
  document.body.appendChild(ta); ta.select();
  try { const ok = document.execCommand('copy'); flash(i, ok); } catch (e) { flash(i, false); }
  document.body.removeChild(ta);
}
function doCopy(text, i) {
  if (navigator.clipboard && window.isSecureContext) {
    navigator.clipboard.writeText(text).then(() => flash(i, true)).catch(() => fallback(text, i));
  } else { fallback(text, i); }
}
function copyBlock(i) { doCopy(TEXTS[i], i); }
function copyShort(i) { doCopy(LINKS[i], i); }
</script></body></html>
